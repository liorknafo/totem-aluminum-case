<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TOTEM aluminum case — 3D view</title>
<style>
  html, body { margin: 0; background: #eef0f3; font-family: system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: 800px 800px; gap: 0; }
  figure { margin: 0; position: relative; width: 800px; height: 500px; background: #eef0f3; }
  figure img { display: block; width: 800px; height: 500px; }
  figcaption { display: none; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="application/json" id="data">{}</script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const D = JSON.parse(document.getElementById('data').textContent);
const PNG_URL = '__PNG__';
if (!PNG_URL.startsWith('__')) D.png = PNG_URL;
const wrap = document.body;
const fail = e => console.error('FAILED', e?.message || e);
addEventListener('error', e => fail(e.error || e.message));
addEventListener('unhandledrejection', e => fail(e.reason));

let PNG = null;
async function pngBytes() {
  const img = new Image();
  img.src = D.png;
  await img.decode();
  const bmp = await createImageBitmap(img, { premultiplyAlpha: 'none', colorSpaceConversion: 'none' });
  const c = new OffscreenCanvas(bmp.width, bmp.height), ctx = c.getContext('2d');
  ctx.drawImage(bmp, 0, 0);
  const rgba = ctx.getImageData(0, 0, bmp.width, bmp.height).data, out = new Uint8Array(rgba.length / 4 * 3);
  for (let i = 0, j = 0; i < rgba.length; i += 4) { out[j++] = rgba[i]; out[j++] = rgba[i + 1]; out[j++] = rgba[i + 2]; }
  return out;
}
async function inflate(m) {
  let bin;
  if (m.b64) bin = Uint8Array.from(atob(m.b64), c => c.charCodeAt(0));
  else bin = PNG.subarray(m.off, m.off + m.len);
  const s = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

async function geometry(m) {
  const b = await inflate(m), nv = m.nv, ni = m.nf * 3;
  const pos = new Float32Array(nv * 3);
  for (let a = 0; a < 3; a++) {
    const o = a * nv * 2;
    for (let i = 0; i < nv; i++) pos[i * 3 + a] = D.lo[a] + (b[o + i] | (b[o + nv + i] << 8)) * D.scale[a];
  }
  const o = nv * 6, idx = new Uint32Array(ni);
  let acc = 0;
  for (let i = 0; i < ni; i++) {
    const z = (b[o + i] | (b[o + ni + i] << 8) | (b[o + 2 * ni + i] << 16) | (b[o + 3 * ni + i] << 24)) >>> 0;
    acc += (z >>> 1) ^ -(z & 1);
    idx[i] = acc;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.computeVertexNormals();
  return g;
}

const mat = (color, metal, rough, extra = {}) => new THREE.MeshStandardMaterial({ color, metalness: metal, roughness: rough, envMapIntensity: 0.3, side: THREE.DoubleSide, ...extra });
const LAYERS = [
  { key: 'top', name: 'Aluminum top', color: '#a3a8b0', m: () => mat('#a3a8b0', 0.6, 0.5, { transparent: true }) },
  { key: 'insert', name: 'Wood window', color: '#b5793f', m: () => mat('#b5793f', 0.0, 0.75) },
  { key: 'bottom', name: 'Aluminum bottom', color: '#8c929b', m: () => mat('#8c929b', 0.6, 0.5) },
  { key: 'pcb', name: 'PCB', color: '#1d6e45', m: () => mat('#1d6e45', 0.1, 0.6) },
  { key: 'switches', name: 'Switches + sockets', color: '#5b6068', m: () => mat('#5b6068', 0.2, 0.55) },
  { key: 'parts', name: 'Diodes, power, reset', color: '#25272b', m: () => mat('#2a2c30', 0.3, 0.5) },
  { key: 'xiao', name: 'XIAO BLE', color: '#3466b0', m: () => mat('#3466b0', 0.3, 0.5) },
  { key: 'battery', name: 'LiPo battery', color: '#cdb87a', m: () => mat('#cdb87a', 0.3, 0.55) },
  { key: 'screws', name: 'Screws', color: '#585d64', m: () => mat('#585d64', 0.8, 0.35) },
  { key: 'caps', name: 'Keycaps', color: '#e6e2d8', off: true, m: () => mat('#e6e2d8', 0.0, 0.7) },
];

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(-80, -120, 260); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 0.6));

const camera = new THREE.PerspectiveCamera(30, 1, 1, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const groups = { L: {}, R: {} }, sideRoot = { L: new THREE.Group(), R: new THREE.Group() };
for (const s of 'LR') { scene.add(sideRoot[s]); for (const l of LAYERS) { groups[s][l.key] = new THREE.Group(); sideRoot[s].add(groups[s][l.key]); } }
const mats = Object.fromEntries(LAYERS.map(l => [l.key, l.m()]));
const edgeMats = Object.fromEntries(['top', 'bottom', 'insert'].map(k => [k, new THREE.LineBasicMaterial({ color: 0x1a1c20, transparent: true, opacity: 0.45 })]));

function pcbMesh(p) {
  const pts = a => { const v = []; for (let i = 0; i < a.length; i += 2) v.push(new THREE.Vector2(a[i], a[i + 1])); return v; };
  const shape = new THREE.Shape(pts(p.outline));
  for (const [x, y, r] of p.circles) { const h = new THREE.Path(); h.absarc(x, y, r, 0, Math.PI * 2, true); shape.holes.push(h); }
  for (const r of p.rings) shape.holes.push(new THREE.Path(pts(r)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: D.pcb_top, bevelEnabled: false, curveSegments: 20 });
  return new THREE.Mesh(g, mats.pcb);
}

function instanced(geom, material, list) {
  const im = new THREE.InstancedMesh(geom, material, list.length), m = new THREE.Matrix4();
  list.forEach(([x, y, a], i) => { m.makeRotationZ(a * Math.PI / 180); m.setPosition(x, y, 0); im.setMatrixAt(i, m); });
  return im;
}

const G = {};
if (D.png) {
  const all = await pngBytes(), n = all[0] | (all[1] << 8) | (all[2] << 16) | (all[3] << 24);
  Object.assign(D, JSON.parse(new TextDecoder().decode(all.subarray(4, 4 + n))));
  PNG = all.subarray(4 + n);
}
await Promise.all(Object.entries(D.meshes).map(async ([k, m]) => { G[k] = await geometry(m); }));
for (const s of 'LR') {
  for (const k of ['top', 'bottom', 'insert', 'parts', 'xiao', 'battery', 'screws', 'caps']) groups[s][k].add(new THREE.Mesh(G[`${k}_${s}`], mats[k]));
  for (const k of ['top', 'bottom', 'insert']) groups[s][k].add(new THREE.LineSegments(new THREE.EdgesGeometry(G[`${k}_${s}`], 28), edgeMats[k]));
  groups[s].pcb.add(pcbMesh(D.pcb[s]));
  groups[s].switches.add(instanced(G.switch, mats.switches, D.switches[s]));
  groups[s].parts.add(instanced(G.diode, mats.parts, D.diodes[s]));
}



// stills for the README: one shot per preset, drawn into <img> elements
const W = 800, H = 500;
renderer.setPixelRatio(1); renderer.setSize(W, H);
camera.aspect = W / H; camera.updateProjectionMatrix();
for (const m of Object.values(mats)) m.envMapIntensity = 0.8;
const fill = new THREE.DirectionalLight(0xffffff, 0.9); fill.position.set(-200, -300, 60); scene.add(fill);
const under = new THREE.DirectionalLight(0xffffff, 0); under.position.set(60, -160, -300); scene.add(under);
const box = new THREE.Box3();
function shoot(p) {
  under.intensity = p.under ? 2.2 : 0; sun.intensity = p.under ? 0.2 : 1.4;
  for (const s of 'LR') {
    sideRoot[s].visible = p.sides.includes(s);
    for (const l of LAYERS) groups[s][l.key].visible = !(p.hide || []).includes(l.key) && (!l.off || (p.show || []).includes(l.key));
    const e = p.explode || 0;
    groups[s].top.position.z = groups[s].screws.position.z = e;
    groups[s].insert.position.z = e * 0.55;
    groups[s].caps.position.z = e * 2;
    groups[s].bottom.position.z = groups[s].battery.position.z = -e * 0.6;
  }
  mats.top.opacity = p.opacity ?? 1; mats.top.depthWrite = (p.opacity ?? 1) > 0.97; edgeMats.top.opacity = 0.45 * (p.opacity ?? 1);
  box.makeEmpty();
  for (const s of p.sides) for (const k of ['top', 'bottom']) box.expandByObject(groups[s][k]);
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const vfov = camera.fov * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const d = new THREE.Vector3(...p.dir).normalize();
  camera.up.set(0, 0, 1);
  camera.position.copy(c).addScaledVector(d, r / Math.sin(Math.min(vfov, hfov) / 2) * (p.zoom || 0.62));
  camera.lookAt(c);
  renderer.render(scene, camera);
  const fig = document.createElement('figure');
  fig.innerHTML = `<img src="${renderer.domElement.toDataURL('image/png')}"><figcaption>${p.name}</figcaption>`;
  document.getElementById('grid').appendChild(fig);
}
const ISO = [0.3, -0.85, 1.05];
[
  { name: 'case_assembled', sides: 'LR', dir: ISO, show: ['caps'] },
  { name: 'case_no_keycaps', sides: 'LR', dir: ISO },
  { name: 'case_exploded', sides: 'LR', dir: ISO, explode: 18, zoom: 0.68 },
  { name: 'case_see_through', sides: 'L', dir: [0.15, -0.8, 1.1], opacity: 0.22, zoom: 0.72 },
  { name: 'case_underside', sides: 'LR', dir: [0.25, -0.7, -1.0], under: true },
  { name: 'case_side', sides: 'L', dir: [0.12, -1, 0.16], explode: 10, zoom: 0.6 },
].forEach(shoot);
console.log('stills done');
</script>
</body>
</html>
