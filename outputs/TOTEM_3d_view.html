const edgeMats = Object.fromEntries(['top', 'bottom', 'insert'].map(k => [k, new THREE.LineBasicMaterial({ color: 0x1a1c20, transparent: true, opacity: 0.45 })]));

function pcbMesh(p) {
  const pts = a => { const v = []; for (let i = 0; i < a.length; i += 2) v.push(new THREE.Vector2(a[i], a[i + 1])); return v; };
  const shape = new THREE.Shape(pts(p.outline));
  for (const [x, y, r] of p.circles) { const h = new THREE.Path(); h.absarc(x, y, r, 0, Math.PI * 2, true); shape.holes.push(h); }
  for (const r of p.rings) shape.holes.push(new THREE.Path(pts(r)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: D.pcb_top, bevelEnabled: false, curveSegments: 20 });
  return new THREE.Mesh(g, mats.pcb);
}

function instanced(geom, material, list) {
  const im = new THREE.InstancedMesh(geom, material, list.length), m = new THREE.Matrix4();
  list.forEach(([x, y, a], i) => { m.makeRotationZ(a * Math.PI / 180); m.setPosition(x, y, 0); im.setMatrixAt(i, m); });
  return im;
}

const G = {};
if (D.png) {
  const all = await pngBytes(), n = all[0] | (all[1] << 8) | (all[2] << 16) | (all[3] << 24);
  Object.assign(D, JSON.parse(new TextDecoder().decode(all.subarray(4, 4 + n))));
  PNG = all.subarray(4 + n);
}
await Promise.all(Object.entries(D.meshes).map(async ([k, m]) => { G[k] = await geometry(m); }));
for (const s of 'LR') {
  for (const k of ['top', 'bottom', 'insert', 'parts', 'xiao', 'battery', 'screws', 'caps']) groups[s][k].add(new THREE.Mesh(G[`${k}_${s}`], mats[k]));
  for (const k of ['top', 'bottom', 'insert']) groups[s][k].add(new THREE.LineSegments(new THREE.EdgesGeometry(G[`${k}_${s}`], 28), edgeMats[k]));
  groups[s].pcb.add(pcbMesh(D.pcb[s]));
  groups[s].switches.add(instanced(G.switch, mats.switches, D.switches[s]));
  groups[s].parts.add(instanced(G.diode, mats.parts, D.diodes[s]));
}
document.getElementById('load').remove();

// UI
const vis = Object.fromEntries(LAYERS.map(l => [l.key, !l.off]));
const layersDiv = document.getElementById('layers');
for (const l of LAYERS) {
  const lab = document.createElement('label');
  lab.innerHTML = `<input type="checkbox" ${vis[l.key] ? 'checked' : ''}><span class="sw" style="background:${l.color}"></span>${l.name}`;
  lab.querySelector('input').onchange = e => { vis[l.key] = e.target.checked; for (const s of 'LR') groups[s][l.key].visible = vis[l.key]; };
  layersDiv.appendChild(lab);
  for (const s of 'LR') groups[s][l.key].visible = vis[l.key];
}
let shown = 'both', panel = 0;
const box = new THREE.Box3();
function frame(view = 'iso') {
  box.makeEmpty();
  for (const s of 'LR') if (sideRoot[s].visible) for (const k of ['top', 'bottom']) box.expandByObject(groups[s][k]);  // the case bounds the rest
  const c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const vfov = camera.fov * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * (camera.aspect - panel / wrap.clientHeight));
  const dirs = { iso: [0.3, -0.85, 1.05], top: [0, -0.01, 1], under: [0, -0.01, -1], side: [0, -1, 0.08] };
  const d = new THREE.Vector3(...dirs[view]).normalize();
  camera.position.copy(c).addScaledVector(d, r / Math.sin(Math.min(vfov, hfov) / 2) * 0.95);
  controls.target.copy(c); camera.lookAt(c); controls.update();
}
document.querySelectorAll('#sides button').forEach(b => b.onclick = () => {
  shown = b.dataset.side;
  document.querySelectorAll('#sides button').forEach(x => x.classList.toggle('on', x === b));
  sideRoot.L.visible = shown !== 'R'; sideRoot.R.visible = shown !== 'L'; frame();
});
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => frame(b.dataset.view));
const ex = document.getElementById('explode'), op = document.getElementById('opacity');
function explode() {
  const e = +ex.value;
  for (const s of 'LR') {
    groups[s].top.position.z = groups[s].screws.position.z = e;
    groups[s].insert.position.z = e * 0.55;  // fits from inside, under the roof
    groups[s].caps.position.z = e * 2;
    groups[s].bottom.position.z = groups[s].battery.position.z = -e * 0.6;
  }
}
ex.oninput = explode;
op.oninput = () => { mats.top.opacity = +op.value; mats.top.depthWrite = +op.value > 0.97; edgeMats.top.opacity = 0.45 * +op.value; };
explode();

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  panel = w > 560 ? document.getElementById('ui').offsetWidth + 12 : 0;
  renderer.setSize(w, h); camera.aspect = w / h;
  camera.setViewOffset(w, h, -panel / 2, 0, w, h);  // keep the model clear of the control panel
  camera.updateProjectionMatrix();
}
if (wrap.clientWidth <= 560) document.getElementById('ui').open = false;
new ResizeObserver(resize).observe(wrap); resize(); frame();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.__v = { groups, mats, camera, controls, frame, sideRoot, renderer, scene };
console.log('ready', Object.keys(G).length, 'meshes');
</script>
</body>
</html>
